    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function () {
            var t = null;
            try {
                var m = location.search.match(/[?&]theme=(light|dark)/);
                if (m) t = m[1];
                if (!t) {
                    try {
                        var s = localStorage.getItem('theme');
                        if (s === 'light' || s === 'dark') t = s;
                    } catch (e) {}
                }
                if (!t) {
                    var wm = (window.name || '').match(/(?:^|;)theme=(light|dark)/);
                    if (wm) t = wm[1];
                }
                if (!t) {
                    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
            } catch (e) { t = 'light'; }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        :root {
            --color-bg: #FAF9F6;
            --color-bg-alt: #FFFFFF;
            --color-text: #1A1A1A;
            --color-text-muted: #4A4A4A;
            --color-accent: #B8503E;
            --color-accent-hover: #9A3F30;
            --color-accent-light: #E07A6B;
            --color-border: #E8E4DD;
            --color-card-bg: #FFFFFF;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.08);
            --transition: all 0.3s ease;
            --max-width: 1100px;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --color-bg: #1A1A1A;
                --color-bg-alt: #1F1F1F;
                --color-text: #FAF9F6;
                --color-text-muted: #B0B0B0;
                --color-accent: #E07A6B;
                --color-accent-hover: #EC9384;
                --color-accent-light: #EC9384;
                --color-border: #333333;
                --color-card-bg: #1F1F1F;
                --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
                --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
                --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
            }
        }

        [data-theme="dark"] {
            --color-bg: #1A1A1A;
            --color-bg-alt: #1F1F1F;
            --color-text: #FAF9F6;
            --color-text-muted: #B0B0B0;
            --color-accent: #E07A6B;
            --color-accent-hover: #EC9384;
            --color-accent-light: #EC9384;
            --color-border: #333333;
            --color-card-bg: #1F1F1F;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
        }

        [data-theme="light"] {
            --color-bg: #FAF9F6;
            --color-bg-alt: #FFFFFF;
            --color-text: #1A1A1A;
            --color-text-muted: #4A4A4A;
            --color-accent: #B8503E;
            --color-accent-hover: #9A3F30;
            --color-accent-light: #E07A6B;
            --color-border: #E8E4DD;
            --color-card-bg: #FFFFFF;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            font-weight: 500;
            line-height: 1.3;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: var(--transition);
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(250, 249, 246, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--color-border);
            z-index: 1000;
            transition: var(--transition);
        }

        [data-theme="dark"] header {
            background: rgba(26, 26, 26, 0.95);
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--color-text);
            letter-spacing: -0.02em;
        }

        .logo span {
            color: var(--color-accent);
        }

        nav ul {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        nav a {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-text-muted);
            position: relative;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--color-accent);
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--color-accent);
        }

        nav a:hover::after {
            width: 100%;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
        }

        .mobile-menu-btn span {
            display: block;
            width: 24px;
            height: 1.5px;
            background: var(--color-text);
            margin: 5px 0;
            transition: var(--transition);
        }

        .theme-toggle {
            position: relative;
            width: 64px;
            height: 34px;
            flex-shrink: 0;
            background: var(--color-bg-alt);
            border: 1px solid var(--color-border);
            border-radius: 999px;
            cursor: pointer;
            margin-right: 12px;
            padding: 0;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            border-color: var(--color-accent);
        }

        .toggle-knob {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--color-accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
        }

        [data-theme="dark"] .toggle-knob {
            transform: translateX(30px);
        }

        .toggle-knob svg {
            width: 15px;
            height: 15px;
        }

        .toggle-hint {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 15px;
            height: 15px;
            color: var(--color-text-muted);
            z-index: 1;
            transition: var(--transition);
        }

        .toggle-hint-sun {
            right: 9px;
        }

        .toggle-hint-moon {
            left: 9px;
        }

        [data-theme="light"] .sun-icon {
            display: block;
        }

        [data-theme="light"] .moon-icon {
            display: none;
        }

        [data-theme="dark"] .sun-icon {
            display: none;
        }

        [data-theme="dark"] .moon-icon {
            display: block;
        }

        [data-theme="light"] .toggle-hint-sun {
            opacity: 0;
        }

        [data-theme="light"] .toggle-hint-moon {
            opacity: 0.5;
        }

        [data-theme="dark"] .toggle-hint-sun {
            opacity: 0.5;
        }

        [data-theme="dark"] .toggle-hint-moon {
            opacity: 0;
        }

        /* Page Header */
        .page-header {
            padding: 160px 24px 80px;
            text-align: center;
            background: var(--color-bg);
        }

        .page-header .hero-badge {
            display: inline-block;
            padding: 6px 14px;
            background: var(--color-accent);
            color: white;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            margin-bottom: 16px;
            color: var(--color-text);
            letter-spacing: -0.02em;
        }

        .page-header p {
            font-size: 1.1rem;
            color: var(--color-text-muted);
            max-width: 600px;
            margin: 0 auto;
            font-weight: 300;
        }

        /* Filter Tabs */
        .filter-section {
            padding: 40px 0 20px;
            background: var(--color-bg);
        }

        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            background: var(--color-card-bg);
            border: 1px solid var(--color-border);
            color: var(--color-text-muted);
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: 2px;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--color-accent);
            border-color: var(--color-accent);
            color: white;
        }

        /* Articles Grid */
        .articles-section {
            padding: 20px 0 100px;
            background: var(--color-bg);
        }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }

        .article-card {
            background: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            overflow: hidden;
            transition: var(--transition);
            opacity: 1;
            transform: translateY(0);
        }

        .article-card.hidden {
            display: none;
        }

        .article-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--color-accent);
        }

        .article-image {
            height: 200px;
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-light) 100%);
            position: relative;
            overflow: hidden;
        }

        .article-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .article-card:hover .article-image img {
            transform: scale(1.05);
        }

        .image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .article-category {
            position: absolute;
            top: 16px;
            left: 16px;
            padding: 4px 10px;
            background: var(--color-accent);
            color: white;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-radius: 2px;
        }

        .article-content {
            padding: 24px;
        }

        .article-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
            font-size: 0.75rem;
            color: var(--color-text-muted);
        }

        .article-title {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--color-text);
            transition: var(--transition);
            line-height: 1.4;
        }

        .article-card:hover .article-title {
            color: var(--color-accent);
        }

        .article-excerpt {
            font-size: 0.9rem;
            color: var(--color-text-muted);
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid var(--color-border);
        }

        .article-source {
            font-size: 0.7rem;
            color: var(--color-text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .article-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--color-accent);
        }

        .article-link:hover {
            gap: 10px;
        }

        .article-link::after {
            content: '→';
            transition: var(--transition);
        }

        .article-link:hover::after {
            transform: translateX(4px);
        }

        /* Back Link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 0;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .back-link:hover {
            color: var(--color-accent);
        }

        .back-link::before {
            content: '←';
        }

        /* Footer */
        footer {
            background: var(--color-bg);
            border-top: 1px solid var(--color-border);
            padding: 40px 0;
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .footer-copyright {
            color: var(--color-text-muted);
            font-size: 0.8rem;
        }

        .footer-links {
            display: flex;
            gap: 24px;
        }

        .footer-links a {
            color: var(--color-text-muted);
            font-size: 0.8rem;
        }

        .footer-links a:hover {
            color: var(--color-accent);
        }

        .footer-social {
            display: flex;
            gap: 12px;
        }

        .footer-social a {
            width: 40px;
            height: 40px;
            border: 1px solid var(--color-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-muted);
            transition: var(--transition);
        }

        .footer-social a:hover {
            background: var(--color-accent);
            border-color: var(--color-accent);
            color: white;
        }

        /* Animations */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate {
            animation: fadeUp 0.6s ease forwards;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }
        .delay-6 { animation-delay: 0.6s; }

        /* Responsive */
        @media (max-width: 768px) {
            nav ul {
                position: fixed;
                top: 72px;
                left: 0;
                right: 0;
                background: var(--color-bg-alt);
                flex-direction: column;
                padding: 24px;
                gap: 16px;
                border-bottom: 1px solid var(--color-border);
                transform: translateY(-100%);
                opacity: 0;
                visibility: hidden;
                transition: var(--transition);
            }

            nav ul.open {
                transform: translateY(0);
                opacity: 1;
                visibility: visible;
            }

            .mobile-menu-btn {
                display: block;
            }

            .page-header {
                padding: 140px 24px 60px;
            }

            .articles-grid {
                grid-template-columns: 1fr;
            }

            .footer-inner {
                flex-direction: column;
                text-align: center;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

    <script>
        // Theme toggle
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;

        function rewriteLinks(theme) {
            var links = document.querySelectorAll('a[href]');
            for (var i = 0; i < links.length; i++) {
                var a = links[i];
                var href = a.getAttribute('href');
                if (!href) continue;
                if (/^(?:[a-z][a-z0-9+.-]*:)?\/\//i.test(href)) continue;
                if (/^(mailto:|tel:)/i.test(href)) continue;
                if (href.charAt(0) === '#') continue;
                if (href.indexOf('.html') === -1) continue;
                var hash = '';
                var hi = href.indexOf('#');
                if (hi >= 0) { hash = href.substring(hi); href = href.substring(0, hi); }
                if (/[?&]theme=/.test(href)) {
                    href = href.replace(/([?&])theme=[^&]*/, '$1theme=' + theme);
                } else {
                    href = href + (href.indexOf('?') >= 0 ? '&' : '?') + 'theme=' + theme;
                }
                a.setAttribute('href', href + hash);
            }
        }

        function applyTheme(theme) {
            html.setAttribute('data-theme', theme);
            try { localStorage.setItem('theme', theme); } catch (e) {}
            try { window.name = 'theme=' + theme; } catch (e) {}
            try {
                var u = new URL(location.href);
                if (u.searchParams.get('theme') !== theme) {
                    u.searchParams.set('theme', theme);
                    history.replaceState(null, '', u);
                }
            } catch (e) {}
            rewriteLinks(theme);
        }

        applyTheme(html.getAttribute('data-theme') || 'light');

        themeToggle.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');

                function renderArticles(filter = 'all') {

                        <div class="article-footer">
                            <span class="article-source">${article.source}</span>
                            ${link}

        function updateFilterCounts() {

        // Deep-link support: scroll to #article-N after JS render

            const target = document.querySelector(window.location.hash);

            }
        }

        // Intersection Observer for scroll animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('animate');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.article-card').forEach(el => {
            observer.observe(el);
        });
